# Which wl-kbptr to build. install.sh reads this.
#
# mode = "fork"  build the tip of `branch` in `repo` (the default)
#        "aur"   install the AUR package instead of building -- stock
#                upstream, so popup-safe mode, drag, hold, peek and double
#                click are all gone
#
# The fork is WidgetKing/wl-kbptr: moverest's wl-kbptr with imthemousenow's
# changes committed on top, on the `imthemousenow` branch. Its tip is what
# gets built, and it is trusted to be right -- run the fork's
# imthemousenow/test.sh before pushing to that branch, because a push there
# is what the next install or update on any machine builds. install.sh asks
# GitHub for the tip's commit and rebuilds only when it is not the one
# already installed.
#
# The fork itself stays on a pinned upstream commit (tag pin/<commit> in the
# fork) and moves only by a deliberate rebase there. The OpenCV 5 build fix
# (upstream 0854a51, issue #99) is in that pin and in no tagged release, and
# the AUR package is still 0.4.1, which does not build against Arch's opencv
# 5 -- so "fork" is also the only mode that gets OpenCV target detection.
mode = "fork"
repo = "https://github.com/WidgetKing/wl-kbptr"
branch = "imthemousenow"

# false builds without OpenCV: hints then label windows instead of detecting,
# and the build loses a 100MB+ dependency.
opencv = true
