# Which wl-kbptr to build. install.sh reads this.
#
# mode = "commit"  build the pinned git commit (the default, and what the
#                  patches in this directory are written against)
#        "aur"     install the AUR package instead of building -- unpatched,
#                  so the popup fix and anything else in pkg/*.patch is gone
#
# The pin is deliberate and there is no "track the latest release" mode: the
# patches here are written against one tree, and a new upstream tree must be
# rebased onto and tested by hand before it reaches anyone. Moving is a commit
# to this repo -- bump `commit` below -- never something that happens on a
# user's machine during an update.
#
# The OpenCV 5 build fix (upstream 0854a51, fixes issue #99) is NOT in any
# tagged release yet, and the AUR package is still 0.4.1 -- which does not
# build against Arch's opencv 5. So "commit" is also the only mode that gets
# you OpenCV target detection on this system.
mode = "commit"
commit = "0854a51cfa5b3d74c0f81f0a4da9b5bb11c9b9f1"

# false builds without OpenCV: hints then label windows instead of detecting,
# and the build loses a 100MB+ dependency.
opencv = true
