# Named wl-kbptr mode chains. Each [preset] becomes `imthemousenow <name>`.
#
# Keys (all optional except `modes`):
#   description = shown in --list and the Omarchy menu
#   modes       = wl-kbptr mode chain, passed as -o modes=...
#   options     = extra `key=value` assignments, space separated, passed as -o
#   scope       = screen | active-window | workspace   (default: screen)
#   needs       = opencv   (preset is hidden when the binary lacks that feature)
#
# Copy this file to ~/.config/omarchy/imthemousenow/presets.toml to override; a user
# file replaces this one entirely.

[quick]
description = "Grid, then bisect, then click"
modes = "tile,bisect,click"

[precise]
description = "Grid, then arrow-key split, then click"
modes = "tile,split,click"

[grid-click]
description = "Grid, then click immediately"
modes = "tile,click"

[detect]
description = "Detect clickable areas on screen, then click"
modes = "floating,bisect,click"
options = "mode_floating.source=detect"
needs = "opencv"

[windows]
description = "Label open windows, then click"
modes = "floating,bisect,click"
options = "mode_floating.source=stdin"
scope = "screen"

[right]
description = "Grid, then right click"
modes = "tile,bisect,click"
options = "mode_click.button=right"

[middle]
description = "Grid, then middle click"
modes = "tile,bisect,click"
options = "mode_click.button=middle"

[move]
description = "Grid, then move the pointer without clicking"
modes = "tile,bisect"
