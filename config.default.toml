# imthemousenow defaults.
#
# This file is a SUPERSET of a wl-kbptr config: every section wl-kbptr
# understands ([general], [mode_tile], [mode_floating], [mode_bisect],
# [mode_split], [mode_click], and anything it gains later) is passed straight
# through when the config is compiled. Two section names are reserved for
# imthemousenow itself and never reach wl-kbptr:
#
#   [imthemousenow]   settings for this tool's own behaviour
#   [mode.<name>]     how a MODE builds a wl-kbptr mode chain
#
# Do not edit this file; it is replaced on update. Put your own settings in
#   ~/.config/omarchy/imthemousenow/config.toml
# which is merged over this one, key by key. See `imthemousenow-config --help`.
#
# Every invocation is four independent choices:
#
#   MODE      grid | hints          how targets are presented
#   SCOPE     window | monitor      where the overlay is drawn
#   ACTION    left-click | right-click | move | drag | hold
#   LIFETIME  single | continuous   one selection, or until Escape
#
# Everything above the ADVANCED divider is a preference: no wrong answers, and
# worth a look. Everything below it is tuning, redesign, or an escape hatch --
# correct as shipped, and explained there for the day you need it.

[imthemousenow]
# Desktop notifications for errors and refusals.
notify = true
# Start from the colours the Omarchy theme template renders. Turn this off to
# use only the colours in this file and your own config.
theme_colors = true
# Apply the current Omarchy font to every mode that draws labels.
theme_font = true

# Hold SPACE and the whole overlay fades to this, so the thing you are aiming
# at can be read through it; let go and it comes back. Nothing moves and
# nothing is selected, so the labels stay exactly where they were while the
# target underneath becomes legible -- which is the point, because the usual
# way a selection goes wrong is a label landing on top of the word that would
# have told you which target you wanted.
#
# 1 turns it off: the overlay is already fully drawn, so holding SPACE has
# nothing to do. This is not [imthemousenow.opacity] above -- that is how the
# overlay looks the whole time it is up, and it scales the theme's colours so
# labels stay readable at any setting. This is the opposite: the entire
# surface, labels included, faded at once for as long as a key is held,
# precisely so none of it is in the way.
#
# NOT available in the second half of a `grid` selection. Once a grid reaches
# bisect, SPACE commits the area exactly as Return does, and it keeps that job;
# `hints` has no bisect in it, so the peek is there throughout. A key that dims
# sometimes and clicks other times would be worse than one that only dims where
# it can.
#
# Needs the wl-kbptr this plugin's install.sh builds
# (pkg/0005-dim-the-overlay-while-a-key-is-held.patch). On a stock build this
# is not passed through at all -- an option it does not know would make it
# reject the whole config -- so the setting is simply inert.
peek_alpha = 0.1

# What you get when a flag is not given. These are the base chord, SUPER + ;.
[imthemousenow.defaults]
mode = "hints"
scope = "window"
action = "left-click"
lifetime = "single"

# How much of the screen an overlay hides, per MODE. 1 is the colours the theme
# renders; below that the dimming and the label backgrounds get more
# transparent, above it more solid (alpha is clamped at fully opaque). Only
# backgrounds scale: labels, borders and the bisect pointer keep the theme's
# alpha, so turning an overlay down makes it see-through, never unreadable.
#
# `default` applies to any MODE without an entry of its own -- see ADVANCED for
# naming one.
[imthemousenow.opacity]
default = 0.8

# A large word on screen naming the ACTION you just moved into. This plugin's
# whole surface is invisible until a key is pressed, so the one thing a new user
# cannot discover by looking is which of the four actions they are now in --
# especially since `;` switches it from inside the overlay, where there is
# nothing but a colour tint to say so.
[imthemousenow.osd]
enabled = true
# top | center | bottom, of whatever the overlay is covering: the screen in
# monitor scope, the focused window in window scope. `top` by default because
# `center` is where hint labels and the bisect grid are, and a word over the
# target defeats the point -- it cannot swallow a click (its input region is
# empty) but it can hide one. In window scope `center` is more defensible: the
# word is then inside the area you are already looking at.
position = "top"
# Announce the ACTION a chord opens in, as well as switches made inside the
# overlay. Off by default, and deliberately: SUPER + ; is a left click, which is
# what a pointer does when you do not tell it otherwise, so naming it every time
# would be noise. Switching is the case worth announcing -- and that includes
# switching BACK to left-click with a second `;`, because by then left-click is
# a choice you made rather than the default you started from. That announcement
# comes from imthemousenow-steer, so it happens whatever this is set to.
on_start = false
#
# The rest of the OSD is tuning rather than preference, and lives here only
# because TOML will not let one table be declared in two places.
#
# Solid first, then a fade. The solid part is when the word gets read; the fade
# is what says "this is telling you something, not asking you for something",
# so it can be ignored rather than dismissed. Total time on screen, and how much
# of that total is the fade out. Half a second all told: long enough to register
# a word you already know the shape of, short enough that it is gone before you
# have aimed. This is a reminder of a state you just chose, not a message to be
# read.
ms = 500
fade_ms = 250
# Font size in px. Large on purpose: it is meant to be read without looking for
# it, from wherever on screen your eyes already were.
size = 120
# Draw the word the way the Omarchy wordmark is drawn: as block art, in the
# FIGlet font Omarchy sets its own name in. `omarchy ascii` does the drawing,
# and install.sh vendors a copy for the Omarchy versions that predate that
# command, so this needs nothing installed either way.
#
# The art is about twice the height the plain word would be -- a wordmark asks
# for more room than a word -- and it shrinks to fit a window in window scope
# like the plain word does. It is also letters-only: the font has no digits or
# punctuation, so an action label with either in it is announced as plain text
# rather than as a picture missing half of itself. Set false for the plain word
# every time.
ascii = true
# Empty follows the Omarchy font, which is what Omarchy renders its own text in
# (fontconfig's monospace, via `omarchy font current`). Name a family here to
# override it. Omarchy's logo is not a candidate: the wordmark ships as SVG
# outlines and ASCII art, and the one font named `omarchy` is an icon font whose
# only glyphs are private-use marks -- it has no letters to set a word in.
font = ""

# The key sheet: F1 or `?` inside an overlay writes down every key that overlay
# listens to, and Escape puts it away. Nothing about this plugin is printed on
# a key, so the sheet is the discoverable half of it.
#
# The sheet replaces the overlay for as long as it is up rather than covering
# it -- it reads its own keyboard, and wl-kbptr is holding one. Dismissing it
# puts the overlay back exactly as it was, so pressing F1 mid-selection costs
# you the letters you had typed and nothing else.
#
# Colours are not here: the sheet is painted in the theme the overlay is, read
# from the same rendered template.
[imthemousenow.help]
# Body text, in px. The keys and the headings are sized off this.
size = 15

# =============================================================================
# ADVANCED
# =============================================================================
# Past this line nothing needs changing to use the plugin. These are tuning
# constants, escape hatches, and the definitions of the MODEs themselves.

# EXPERIMENTAL, and the one thing down here with a reason to be turned on. An
# overlay normally takes keyboard focus, and that is what closes a context menu
# or a browser extension popup the moment it appears -- the compositor drops the
# popup's grab and tells the client it is done. Turn this on and the overlay
# asks for no keyboard focus at all: the keys come from compositor bindings
# instead, relayed through a file wl-kbptr reads, and whatever popup you opened
# is still there to aim at.
#
# The cost is that every key the overlay uses must be a binding: they live in
# their own submap, and anything not bound there is swallowed rather than
# reaching the window underneath. Needs the wl-kbptr built by this plugin's
# install.sh (pkg/0002-read-keys-from-a-channel-*.patch); with a stock wl-kbptr
# this is ignored and the overlay behaves as it always did.
[imthemousenow.popups]
keep_open = false

# --- per-MODE opacity --------------------------------------------------------
# A MODE named here overrides [imthemousenow.opacity].default, so `windows` can
# follow `hints` or not, as you like:
#
#   [imthemousenow.opacity]
#   hints = 0.8
#   grid = 1.0

# --- the words, and drag -----------------------------------------------------
# What the OSD says for each ACTION, and later what a two-stage action calls
# its stages: drag announces DRAG when it takes hold and DROP when it is about
# to let go. Upper-cased at display time, so these stay readable here.
# Colours are not here either. The theme template supplies exactly one -- the
# accent, as left-click's -- and bin/imthemousenow-config turns the other four
# off it, 72 degrees apart around an OkLCh wheel. Setting `color` on any action
# below pins that one and leaves the rest derived.
#
# The rest of each entry is what an ACTION IS, rather than how it looks, and it
# is read rather than hardcoded -- by the launcher, by imthemousenow-steer and
# by `check`, so the vocabulary is declared once rather than once per caller:
#
#   button      which button the overlay clicks with. Empty means no click
#               stage at all: the pointer lands and nothing is pressed, which
#               is what move, drag, drop and hold each need for their own
#               reason -- see the entries below.
#   requires    a string that is in the wl-kbptr this plugin builds and not in
#               a stock one. The binary is asked for it before the chord opens
#               anything, because the alternative is finding out after you have
#               aimed. Absent means the action works on any build.
#   patch       which patch supplies `requires`, named in the refusal so the
#               message says what to go and build.
#   switchable  whether `;` `:` `'` `"` can switch INTO this action from inside
#               an overlay. False for one that is only ever arrived at.
[imthemousenow.action.left-click]
label = "left"
button = "left"
switchable = true

[imthemousenow.action.right-click]
label = "right"
button = "right"
switchable = true

[imthemousenow.action.move]
label = "move"
# No click stage: the pointer lands where you aimed and stays there.
button = ""
switchable = true

# Drag is two passes: one to say what to pick up, one to say where to put it.
# Both of them only move the pointer -- nothing is pressed until both ends are
# known, which is why abandoning a drag halfway can never leave a button down.
#
# The two ends need not be on the same monitor: in the drop pass the arrow keys
# take the overlay to the screen that way, and the press walks the whole path
# across the boundary. The digits do nothing there, and no key changes
# workspace -- mid-drag, an arrow that might mean "workspace" and might mean
# "monitor" leaves you unsure which one you just did.
[imthemousenow.action.drag]
label = "drag"
# No click stage in either pass. The press is emitted afterwards, by a separate
# wl-kbptr --drag, once both ends are known; an overlay that clicked here would
# be a click rather than a drag.
button = ""
switchable = true
requires = "--drag"
patch = "pkg/0003-walk-a-path-*.patch and pkg/0004-Say-a-drag-path-*.patch"
# How long the pointer takes to travel from the thing it picked up to where it
# is dropped. It cannot be instant: a client reads drag-and-drop out of the
# stream of motion events under a held button, and one jump from A to B is a
# single event for it to infer everything from -- toolkits that arm on a
# movement threshold, autoscroll on dwell, or animate a drop target never get
# the chance. 300ms is long enough for all of that and short enough not to feel
# like watching an animation. Raise it if an application keeps missing the drop.
duration_ms = 300
# MODE for the second pass. `same` follows the MODE that picked up, so a drag
# started in hints drops in hints; name a MODE outright (grid, hints) to always
# drop in that one. Worth knowing before choosing: hints answers "what is
# clickable", which is not the same question as "where do I put this" -- a drop
# onto blank canvas, or between two list items, is not a hint. `grid` can reach
# any pixel, so it is the one that can always answer.
drop_mode = "same"

# Hold is the other half of drag's idea: one pass to say what to take hold of,
# and then the button stays down while you fly the pointer by hand -- arrows,
# WASD or hjkl to move, Shift for a bigger step, Space, Return or Escape to let
# go. Nothing is drawn over the screen while it is on, because the whole reason
# to hold rather than drag is to watch the thing you are moving: the pointer
# wears a pulsing halo instead, which is the only sign that a button is down.
#
# What it is for is everything a drag cannot say in advance -- a scrollbar
# pulled until the page looks right, a window edge sized by eye, a selection
# swept over text you are reading as you go.
#
# Needs the wl-kbptr this plugin's install.sh builds
# (pkg/0006-Hold-a-button-*.patch); on a stock build the chord refuses up front
# rather than aiming twice and failing at the press.
[imthemousenow.action.hold]
label = "hold"
# No click stage, for drag's reason sharpened: the press is held open by a
# separate wl-kbptr --hold, and a click here would let go of the thing before
# it had been steered anywhere.
button = ""
switchable = true
requires = "--hold"
patch = "pkg/0006-Hold-a-button-*.patch"
# Pixels per keypress. The keys repeat while they are held, so `step` is also
# a speed: 40px about twenty-five times a second is a pointer crossing a 1080p
# screen in under two seconds, which is fast enough to get somewhere and slow
# enough to stop where you meant.
#
# SHIFT is five times this, and is not its own setting. The big step is for
# crossing a screen you are not aiming inside yet -- another monitor, the far
# side of a long page -- which is a thing you want RELATIVE to your ordinary
# speed, not an absolute number: set independently, a slower step and an
# untouched big step turn SHIFT into a jump you cannot aim with at all. One
# number, one slider, and the pair always keeps its proportion.
step = 40
# The outer radius of the halo around the pointer, in pixels. It is drawn as
# three rings of falling alpha inside this, pulsing in and out.
halo_size = 44

# The second pass of a drag, which is not an ACTION you can ask for -- you
# arrive at it by picking something up. It gets its own entry because it needs
# its own word: the overlay looks the same as the pass before it, and "DROP" is
# the only thing that says which half of the drag you are in.
[imthemousenow.action.drop]
label = "drop"
button = ""
# Not switchable: you arrive at a drop by picking something up, and there is
# nothing sensible for a key to mean that would switch you into one.
switchable = false

# --- timing guards -----------------------------------------------------------
# Not preferences. If one of these needs changing, something is wrong and the
# fix is probably code; they are here so a misbehaving compositor can be worked
# around without one.

# Switching ACTION, workspace or monitor from inside the overlay tears it down
# and puts it back up. A workspace or monitor change needs the compositor to
# settle first, or the new overlay measures the screen we just left.
[imthemousenow.switch]
settle_ms = 80
# A bare SHIFT or ALT tap toggles SCOPE or MODE, but a modifier release also
# ends a chord like `:` (SHIFT + SEMICOLON). A tap this soon after any other
# overlay key is treated as the tail of that chord, not a tap.
tap_debounce_ms = 400

[imthemousenow.continuous]
# Continuous reopens the overlay after each completed selection. A pass that
# "succeeds" faster than this is treated as a misfire; this many in a row stops
# the loop instead of spinning.
guard_ms = 200
max_quick_exits = 5
# 0 = no limit on how many clicks one burst may make.
max_passes = 0

# `-` `=` `_` `+` resize the window the overlay is drawn over, the way SUPER +
# those keys resize the focused window outside it. This is the step, in pixels,
# and 100 is what Omarchy's own unmodified binding uses -- diverging from it
# makes the overlay behave unlike the desktop around it.
[imthemousenow.resize]
step = 100

# --- modes ------------------------------------------------------------------
# These define what the MODEs ARE, rather than configuring them; editing one is
# a redesign, not a preference.
#
# chain   : wl-kbptr mode chain, minus the trailing click (ACTION adds that)
# refine  : appended to the chain to narrow the selection down to a point.
#           bisect (home-row halving) or split (arrow keys), or "" for neither.
# source  : hints only. detect = OpenCV on the framebuffer, windows = rectangles
#           from hyprctl, auto = detect when the build supports it.

[mode.grid]
description = "Label a grid of cells, then narrow down"
chain = "tile"
refine = "bisect"

[mode.hints]
description = "Label what looks clickable, then click it"
chain = "floating"
# Nothing: a hint already names a target, so clicking it is the whole point.
# Narrowing down afterwards would ask you to aim at something you just named.
refine = ""
source = "auto"

# The picker a swap opens: one label per window, and nothing to narrow down --
# a window is already a target. Reachable on its own (`--mode windows`), which
# is also how you aim at a window the detector keeps missing.
[mode.windows]
description = "Label each window, then pick one"
chain = "floating"
refine = ""
source = "windows"

# --- wl-kbptr passthrough ----------------------------------------------------
# Colours are not set here: they come from the Omarchy theme template. Anything
# you put in these sections wins over the theme.
#
# `general.cancellation_status_code` is NOT here and cannot be set: wl-kbptr
# defaults it to 0, which makes a cancelled selection indistinguishable from a
# completed one, and continuous lifetime depends on telling them apart.
# imthemousenow-config forces it to 1 after every layer has been merged.

# home_row_keys is deliberately NOT set. Left unset, wl-kbptr derives it from
# the active keymap (a s d f j k l m to pick bisect sub-areas, then g, h, b to
# commit with a left, right or middle click), which follows a non-QWERTY layout
# where a hard-coded string would not. `;` is no longer a candidate for the
# right-click key: while an overlay is up it belongs to the submap, which
# switches ACTION for the whole overlay instead of just one selection.
#
# If you do set it, it must be EXACTLY 11 characters or wl-kbptr rejects this
# entire file and every chord silently does nothing. `imthemousenow-config
# check` tests for that.

# 27 symbols, not 26, and the reason is arithmetic rather than taste. wl-kbptr
# caps the grid at 26*26 cells but derives rows and columns by truncating a
# square root, so the product can land just over that cap -- 680 cells in a
# 1330x1102 window. Label length is "how many times does the count divide by
# the symbol count", so one cell past 675 costs a THIRD character on every
# label in the grid. A 27th symbol raises the ceiling to 729 and keeps the
# whole grid at two characters.
[mode_tile]
label_symbols = "abcdefghijklmnopqrstuvwxyz,"

[mode_floating]
label_symbols = "abcdefghijklmnopqrstuvwxyz,"
