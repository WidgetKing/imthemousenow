# imthemousenow defaults.
#
# This file is a SUPERSET of a wl-kbptr config: every section wl-kbptr
# understands ([general], [mode_tile], [mode_floating], [mode_bisect],
# [mode_split], [mode_click], and anything it gains later) is passed straight
# through when the config is compiled. Two section names are reserved for
# imthemousenow itself and never reach wl-kbptr:
#
#   [imthemousenow]   settings for this tool's own behaviour
#   [preset.<name>]   named mode chains
#
# Do not edit this file; it is replaced on update. Put your own settings in
#   ~/.config/omarchy/imthemousenow/config.toml
# which is merged over this one, key by key. See `imthemousenow-config --help`.

[imthemousenow]
# Preset used when none is named on the command line.
default_preset = "quick"
# Refuse to open a second overlay while one is up. wl-kbptr grabs the keyboard,
# so a second instance can lock the session out.
single_instance = true
# Desktop notifications for errors and refusals.
notify = true
# Start from the colours the Omarchy theme template renders. Turn this off to
# use only the colours in this file and your own config.
theme_colors = true
# Apply the current Omarchy font to every mode that draws labels.
theme_font = true

[imthemousenow.scope]
# screen | active-window | workspace, when a preset does not say.
default = "screen"

[imthemousenow.repeat]
# Repeat mode reopens the overlay after each completed selection. A pass that
# "succeeds" faster than this is treated as a misfire; this many in a row stops
# the loop instead of spinning.
guard_ms = 200
max_quick_exits = 5
# 0 = no limit on how many clicks one burst may make.
max_passes = 0

# --- presets ----------------------------------------------------------------
# modes   : wl-kbptr mode chain
# options : extra `section.key=value` assignments, space separated
# scope   : overrides [imthemousenow.scope].default
# needs   : "opencv" hides the preset on a build without it

[preset.quick]
description = "Grid, then bisect, then click"
modes = "tile,bisect,click"

[preset.precise]
description = "Grid, then arrow-key split, then click"
modes = "tile,split,click"

[preset.grid-click]
description = "Grid, then click immediately"
modes = "tile,click"

[preset.detect]
description = "Detect clickable areas on screen, then click"
modes = "floating,bisect,click"
options = "mode_floating.source=detect"
needs = "opencv"

[preset.windows]
description = "Label open windows, then click"
modes = "floating,bisect,click"
options = "mode_floating.source=stdin"

[preset.right]
description = "Grid, then right click"
modes = "tile,bisect,click"
options = "mode_click.button=right"

[preset.middle]
description = "Grid, then middle click"
modes = "tile,bisect,click"
options = "mode_click.button=middle"

[preset.move]
description = "Grid, then move the pointer without clicking"
modes = "tile,bisect"

# --- wl-kbptr passthrough ----------------------------------------------------
# Colours are not set here: they come from the Omarchy theme template. Anything
# you put in these sections wins over the theme.

[general]
# Non-zero so a cancelled selection is distinguishable from a completed one.
# Repeat mode depends on this to know when to stop.
cancellation_status_code = 1
